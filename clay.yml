#
# Le compilateur clay va par defaut aller regarder s'il y a un `clay.yml`, s'il y en a pas
# il va chercher dans tous les .yml a la racine et check s'il y a un namespace `clay:` de dans, si oui
# il va l'utiliser pour compiler.
#
# Avec un fichier de config, l'utiliser a juste a faire `./forge` ou `./forge --config=./path/conf.yml`
#
clay:
  env:
    WATCH_CONF_TIME: '*/30 * * * * *'
  sources:
    raw_paths: # if `path` is set before `prefix`, it will not be applied to this `path`
      - main.cpp
    prefix: ./FPP/sources/
    suffix: .cpp
    paths: # `prefix` here, is applied
      - ProgramOptions/Flags
      - Symtab/Symtab
      - FileHelpers/File
      - FileHelpers/DependenciesPaths
      - States/GState
      - States/LState
      - Logs/LogVerbosity
      - CompilerAttributes/CompilerAttributes
      - States/Arena
      - Utils/djb2
      - Preprocessing/Preprocessing
      - Utils/id_generator
  compiler: clang
  options:
    - --verbose
  includes_paths:
    - ./includes/
  rules:
    base:
    watch:
    clean:
    oclean:
    fclean:
    re:
    custom_rule:
      description: Hihi
      cmd: |
        echo FEUR
  objects:    # Object files are not necessary, but, else the compiler will relink each times it compiles
    path: .objs
    relative: false
    suffix: _yo_la_team
    extension: obj
    headers:
      relative: false # sub-keys is same than objets, but generate *.d files only if at least the key `headers:` is declared
             # their default values is same than objects except for the `extension` (is 'd')
  output:
    kind: bin
    path: .
    name: hasher
  links:
    - /lib/libc.a
  links_paths:
    - /lib_x64_86/
  depends_on: # auto link if MEgide and/or hopt are libraries
    MEgide:
      path: ./thirdparty/MEgide
      to_includes: true # Will append to this `includes_paths` the `includes_paths` of MEgide | BY DEFAULT set to `false`
      options: # to add some additionnal program options
        - --verbose
    hopt:
      path: ./thirdparty/hopt
      to_includes: true # Will append to this `includes_paths` the `includes_paths` of hopt | BY DEFAULT set to `false`
      options: # to add some additionnal program options
        - --verbose
  output_format:
    colors: true
    messages:
      on_start: 'Starting compilation!'
      on_end: 'Compilation finished!'
      for_each_files:
        always: 'Checking file %s'
        skipped: 'File %s already compiled'
        dirty: '%s compiling...'
      on_error: '❌ Build failed: %s'
      on_success: '✅ Build successful of %s'
      on_nothing_to_do: ''
    scripts:
      for_each_files:
        always: scripts/progress_bar.sh {filename} {total_file_count} {percent} {status}
    show_commands: false
    show_stats: true # Compilation time + files number + ...
