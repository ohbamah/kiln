#
# Le compilateur clay va par defaut aller regarder s'il y a un `clay.yml`, s'il y en a pas
# il va chercher dans tous les .yml a la racine et check s'il y a un namespace `clay:` de dans, si oui
# il va l'utiliser pour compiler.
#
# Avec un fichier de config, l'utiliser a juste a faire `./forge` ou `./forge --config=./path/conf.yml`
#
# TODO:
#  - Can execute rules when Kiln is --watch(ing)
#  - Expend `*` and `**` jokers
#  - Option to not hide `Compiling...` and `Compilation done in Ns`
#
kiln:
  env:
    VAR: value
  # var:
  #   VERSION: feur # usage ${FEUR}, not in env, just here (in config file)
  compiler: clang++
  # parallelization: true
  # platform:
  #   windows:
  #     links: [ws2_32, winmm]
  #     options: [-DWIN32]
  #   macos:
  #     links: ["-framework Cocoa"]
  #     options: [-DMACOS]
  #   linux:
  #     links: [pthread, dl]
  #     options: [-DLINUX]
  sources:
    prefix: srcs/
    suffix: .cpp
    paths:
      - fetch
      - generate
      - kiln
      - main
      - utils
      - print
      - watch
      - termios
      - DateTime
  options:
    - -std=c++20
    - -Wall
    - -Wextra
    - -Wno-missing-field-initializers
    - -O3
    - -fPIE
    - -g3
    # - if: ${DEBUG == "1"}
    #   then:
    #     if: ${1 == "1"}
    #     then: [-g3, -fsanitize=address]
    #     else: [-g]
    #   else: [-O3, -DNDEBUG]
  # runtime_options:
  #   - -fsanitize=address
  includes_paths:
    - hopt/includes
    - srcs/includes
    - includes
  rules:
    watch:
    clean:
    oclean:
    fclean:
    re:
    custom_re:
      # run: |
      #   rm -rf $OBJECTS_PATH
      #   rm -f $OUTPUT_PATH/$OUTPUT_FILENAME
      #   $(base)
      description: Yo mister White
  objects:
    path: .objs
    relative: false
    headers:
      path: .objs
      relative: false
  output:
    kind:
    name: kiln
  links:
    - libhopt.a
  links_paths:
    - hopt
  output_format:
    scripts:
      for_each_file:
        after: echo '"✔️ \\033[1;32mCompilation \\033[38;2;250;189;0m$SOURCE_FILENAME\\033[0m"'
      on_success: echo '"\\033[1;36mExécutable $OUTPUT_FILENAME créé avec succès!\\033[0m"'
      on_error: echo '"❌​\\033[1;31mÉchec de la création de $OUTPUT_FILENAME\\033[0m"'
      on_nothing_to_do: echo '"\\033[1;38;2;211;54;130mAll has already been done for $OUTPUT_FILENAME!\\033[0m"'
